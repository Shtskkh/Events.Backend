name: events

services:
  backend:
    build:
      context: ./src/
      dockerfile: Dockerfile
      
    container_name: backend-dev
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DbConnection=Host=db_postgres;Database=Events;Username=postgres;Password=1
    depends_on:
      migrator:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy

  db_postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: Events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 10s
          timeout: 5s
          retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/18/docker

  migrator:
    build:
      context: ./src/
      dockerfile: Migrator.Dockerfile
    container_name: migrator
    restart: no
    environment:
      - ConnectionStrings__DbConnection=Host=db_postgres;Database=Events;Username=postgres;Password=1
    depends_on:
      db_postgres:
        condition: service_healthy

volumes:
  pg_data: