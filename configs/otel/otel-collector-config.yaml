receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9002
    username: default
    password: "1"
    database: Events
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    
service:
  pipelines:
    traces:
      receivers: [ otlp ]
      exporters: [ clickhouse ]
    metrics:
      receivers: [ otlp ]
      exporters: [ clickhouse ]
    logs:
      receivers: [ otlp ]
      exporters: [ clickhouse ]